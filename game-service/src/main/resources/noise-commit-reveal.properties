# Noise commit-reveal config (client-owned) — sent to the enclave per request.
# Override the file at runtime with NOISE_CONFIG_PATH=/path/to/file.properties
encryptionType=SHA256
useEncryption=true
noiseStringLength=100
noiseEmojiLength=15
noiseAdjustmentLength=0.2

# dice rolled inside the enclave (kept as the trusted number generation)
diceCount=3
diceFaces=6

# enclave hold between commit and reveal frames
delaySeconds=3

# embedded verbatim into the payload (optional; blank = none)
sessionId=
